name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check notifier tests
      - name: Format check (ruff)
        run: ruff format --check notifier tests
      - name: Types (mypy)
        run: mypy notifier
      - name: Tests (pytest)
        run: pytest -q
